runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 8
  cpu: 1
  memoryMiB: 1024

env:
  # No forwarding header is trusted by default. Global abuse ceilings always
  # apply. Enable a single overwritten IP header only after ingress verification.
  - variable: TRUSTED_CLIENT_IP_HEADER
    value: ""
    availability:
      - RUNTIME
  - variable: BAG_DESIGNER_DAILY_GENERATION_LIMIT
    value: "60"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://sanpack.uz
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: stamply-4df8a
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: stamply-4df8a.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: stamply-4df8a.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: sanpack-firebase-api-key
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: sanpack-firebase-messaging-sender-id
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: sanpack-firebase-app-id
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CATALOG_PDF_URL
    secret: sanpack-catalog-pdf-url
    availability:
      - BUILD
      - RUNTIME
  - variable: SANPACK_USE_SEED_DATA
    value: "false"
    availability:
      - RUNTIME
  - variable: TELEGRAM_CONFIG_ENCRYPTION_KEY
    secret: sanpack-telegram-config-encryption-key
    availability:
      - RUNTIME
