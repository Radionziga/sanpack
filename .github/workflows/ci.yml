name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ls --depth=0
      - run: npm test
      - run: npm run test:security:emulator
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          SANPACK_USE_SEED_DATA: 'true'
          NEXT_PUBLIC_SITE_URL: https://sanpack.uz
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-sanpack-audit.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-sanpack-audit
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-sanpack-audit.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci-demo
      - run: git diff --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          SANPACK_USE_SEED_DATA: 'true'
      - run: npm run test:e2e:taxonomy
        env:
          CI: 'true'
          SANPACK_USE_SEED_DATA: 'true'
